[workspace]
members = [
    "crates/rustle-core",
    "crates/rustle-tray",
    "crates/rustle-detection",
    "crates/rustle-audio",
    "crates/rustle-transcription",
    "crates/rustle-ai",
    "crates/rustle-storage",
    "crates/rustle-ui",
    ".",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.86"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
thiserror = "1.0.69"
tokio = { version = "1.37.0", features = ["full"] }
toml = "0.8.14"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }

[package]
name = "rustle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust-native desktop meeting notes app for Fedora Linux on Hyprland"
repository = "https://github.com/afobsidian/rustle"
homepage = "https://github.com/afobsidian/rustle"

[dependencies]
anyhow.workspace = true
notify-rust = "4.11.7"
rustle-ai = { path = "crates/rustle-ai", features = ["provider-llama-cpp"] }
rustle-audio = { path = "crates/rustle-audio" }
rustle-core = { path = "crates/rustle-core" }
rustle-detection = { path = "crates/rustle-detection" }
rustle-storage = { path = "crates/rustle-storage" }
rustle-tray = { path = "crates/rustle-tray" }
rustle-transcription = { path = "crates/rustle-transcription" }
rustle-ui = { path = "crates/rustle-ui" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
uuid.workspace = true

[package.metadata.generate-rpm]
summary = "Rust-native desktop meeting notes app for Fedora Linux on Hyprland"
release = "1"
assets = [
    { source = "target/release/rustle", dest = "/usr/bin/rustle", mode = "755" },
    { source = "assets/icons/rustle.svg", dest = "/usr/share/rustle/icons/rustle.svg", mode = "644" },
    { source = "assets/icons/rustle-recording.svg", dest = "/usr/share/rustle/icons/rustle-recording.svg", mode = "644" },
]
