[package]
name = "rustle-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
provider-bench = ["provider-llama-cpp"]
provider-llama-cpp = [
	"dep:encoding_rs",
	"dep:hf-hub",
	"dep:llama-cpp-2",
]

[dependencies]
encoding_rs = { version = "0.8.35", optional = true }
hf-hub = { version = "0.4.3", optional = true }
llama-cpp-2 = { version = "0.1.146", optional = true }
rustle-core = { path = "../rustle-core" }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[[example]]
name = "provider_bench"
path = "examples/provider_bench.rs"
required-features = ["provider-bench"]
