name: Update Cargo.toml version on tag

on:
  push:
    tags:
      - 'v*'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and version
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "Tag: $TAG, Version: $VERSION"

      - name: Update Cargo.toml version
        run: |
          python -m pip install --quiet toml
          python - "$VERSION" - <<'PY'
import sys
from pathlib import Path
import toml
v = sys.argv[1]
p = Path('Cargo.toml')
if not p.exists():
    raise SystemExit('Cargo.toml not found')
obj = toml.load(p)
if 'package' not in obj:
    raise SystemExit('No [package] table in Cargo.toml')
obj['package']['version'] = v
p.write_text(toml.dumps(obj))
print(f'Updated Cargo.toml to version {v}')
PY
        env:
          VERSION: ${{ env.VERSION }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Bump package version to ${{ env.VERSION }}"
          branch: "bump/version-${{ env.VERSION }}"
          title: "Bump package version to ${{ env.VERSION }}"
          body: |
            Automated PR to bump package version to ${{ env.VERSION }} based on tag ${{ env.TAG }}.

            This is generated by the update-version-on-tag workflow.
          base: main
          labels: automated,version
