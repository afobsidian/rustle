name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "copilot/**"

permissions:
  contents: read

jobs:
  validate:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.toolchain }}' --profile minimal --component rustfmt --component clippy
          rustup default '${{ matrix.toolchain }}'

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Run CI
        run: make ci
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}
