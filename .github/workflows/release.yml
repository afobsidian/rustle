name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          make ci
  publish:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: rustle-desktop-*
          path: evidence
      - name: Assemble only tested artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$version"
          mkdir dist
          cp evidence/rustle-desktop-fedora/candidate/rustle.tar.gz "dist/rustle-$version-x86_64-unknown-linux-gnu.tar.gz"
          cp evidence/rustle-desktop-fedora/candidate/rustle.rpm "dist/rustle-$version.x86_64.rpm"
          cp evidence/rustle-desktop-arch/candidate/*.pkg.tar.zst dist/
          cmp evidence/rustle-desktop-fedora/candidate/usr/bin/rustle evidence/rustle-desktop-arch/candidate/usr/bin/rustle
          cmp evidence/rustle-desktop-fedora/candidate/usr/bin/rustle evidence/rustle-desktop-obsidian-blue/candidate/usr/bin/rustle
          cd dist
          for artifact in *.tar.gz *.rpm *.pkg.tar.zst; do sha256sum "$artifact" >"$artifact.sha256"; done
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* --generate-notes --verify-tag
          fi
